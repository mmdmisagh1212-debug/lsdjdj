<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"/>
<title>🇺🇸 WireGuard4582 · آمریکا</title>
<style>
:root {
  --accent: #00ffcc;
  --accent2: #ff00aa;
  --bg1: #01010a;
  --bg2: #0a0020;
  --glow1: rgba(0,255,204,0.4);
  --glow2: rgba(255,0,170,0.35);
  --text: #eef7ff;
  --muted: #94a3b8;
  --card: rgba(12,20,37,.92);
  --border: #00ffcc40;
  --radius: 28px;
  --btn-r: 24px;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{min-height:100%;background:var(--bg1);color:var(--text);font-family:Tahoma,"Segoe UI",system-ui,sans-serif;line-height:1.6}
.bg{position:fixed;inset:0;z-index:0;pointer-events:none;background:radial-gradient(circle at 15% 10%,var(--glow1),transparent 32%),radial-gradient(circle at 85% 90%,var(--glow2),transparent 32%),linear-gradient(160deg,var(--bg1),var(--bg2) 50%,var(--bg1))}
.wrap{position:relative;z-index:1;max-width:480px;margin:0 auto;padding:12px 12px 70px}
.topbar{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:10px}
.status-btn{display:inline-flex;align-items:center;gap:6px;padding:8px 14px;border-radius:999px;font-weight:800;font-size:.78rem;border:none;cursor:default;background:linear-gradient(135deg,#10b981,#34d399);color:#042f1a}
.brand{text-align:center;font-size:1.35rem;font-weight:900;letter-spacing:.06em;margin:4px 0;background:linear-gradient(90deg,#fff,var(--accent),var(--accent2));-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.hero{text-align:center;padding:16px 14px;margin-bottom:12px;border-radius:var(--radius);background:linear-gradient(145deg,var(--card),rgba(7,10,24,.75));border:1px solid var(--border)}
.hero h1{font-size:1.2rem;margin:6px 0;color:var(--text)}
.badge{display:inline-block;padding:4px 10px;border-radius:999px;font-size:.66rem;font-weight:800;border:1px solid var(--border);background:rgba(255,255,255,.05);color:var(--accent);margin:3px}
.nav{display:grid;grid-template-columns:1fr 1fr;gap:5px;margin-bottom:12px}
.nav button{padding:10px 4px;border-radius:12px;border:1px solid rgba(148,163,184,.2);background:var(--card);color:var(--muted);font-weight:800;font-size:.72rem;cursor:pointer}
.nav button.on{color:#fff;border-color:var(--accent);background:linear-gradient(135deg,var(--accent)50,var(--accent2)30)}
.card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:16px;margin-bottom:12px}
.card h2{font-size:.95rem;margin-bottom:10px;color:var(--text)}
label{display:block;margin:8px 0 4px;font-size:.72rem;color:var(--muted);font-weight:800}
input,select{width:100%;padding:11px 12px;background:rgba(3,8,17,.85);border:1px solid rgba(148,163,184,.22);border-radius:10px;color:var(--text);font-size:15px;outline:none}
.row{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:5px;padding:11px 13px;border:none;border-radius:24px;font-weight:800;font-size:.84rem;cursor:pointer;margin:3px 2px}
.btn-go{background:linear-gradient(135deg,var(--accent),var(--accent2));color:#061018;width:100%;margin-top:10px;padding:14px}
.item{background:linear-gradient(145deg,rgba(10,22,38,.95),rgba(6,12,24,.92));border:1px solid var(--border);border-radius:var(--radius);padding:14px;margin-bottom:10px}
.item b{color:var(--accent);font-size:.95rem}
.meta{font-size:.76rem;color:var(--muted);margin-top:3px}
.dns{margin-top:6px;padding:8px;background:rgba(1,6,14,.7);border-radius:10px;direction:ltr;text-align:left;font-family:monospace;font-size:.7rem;color:#8df6ff;border:1px solid var(--border)}
.stats{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px;margin-bottom:10px}
.stat{background:rgba(15,28,47,.8);border:1px solid var(--border);border-radius:12px;padding:10px;text-align:center}
.stat .n{font-size:1.15rem;font-weight:900;color:var(--accent)}
.stat .l{font-size:.62rem;color:var(--muted)}
.pill{display:inline-flex;padding:2px 8px;border-radius:999px;font-size:.66rem;font-weight:800}
.pill-ok{background:rgba(84,247,178,.14);color:#72f7bf;border:1px solid rgba(84,247,178,.3)}
.sec{display:none}.sec.on{display:block}
</style>
</head>
<body>
<div class="bg"></div>
<div class="wrap">
  <div class="topbar">
    <button class="status-btn">🟢 فعال</button>
  </div>
  <div class="brand">WireGuard4582</div>
  <div class="hero">
    <h1>🇺🇸 WireGuard4582 Admin</h1>
    <p>حجم کل: 10,000,000 GB · اعتبار: 2 ماه</p>
  </div>
  <div class="nav">
    <button class="on" id="n1" onclick="goTab(1)">⚡ ساخت</button>
    <button id="n2" onclick="goTab(2)">◈ پروفایل‌ها</button>
  </div>
  <div class="card sec on" id="s1">
    <h2>🚀 ساخت کانفیگ</h2>
    <label>✨ نام کانفیگ</label>
    <input type="text" id="name" value="HEADSHOT-VIP" />
    <div class="row">
      <div><label>⏱ روز</label><input type="number" id="days" value="60"/></div>
      <div><label>💾 GB</label><input type="number" id="gb" value="100"/></div>
      <div><label>👥 کاربر</label><input type="number" id="users" value="1"/></div>
    </div>
    <button class="btn btn-go" onclick="doMake()">⚡ تولید کانفیگ</button>
  </div>
  <div class="card sec" id="s2">
    <h2>◈ پروفایل‌ها</h2>
    <div id="list"><div style="text-align:center;color:#94a3b8">هنوز کانفیگی ساخته نشده</div></div>
  </div>
</div>
<script>
var CONFIGS = [];
function goTab(n){
  document.getElementById('s1').className = 'card sec ' + (n===1?'on':'');
  document.getElementById('s2').className = 'card sec ' + (n===2?'on':'');
  document.getElementById('n1').className = n===1?'on':'';
  document.getElementById('n2').className = n===2?'on':'';
}
function doMake(){
  var name = document.getElementById('name').value || 'WG-Config';
  var days = document.getElementById('days').value || 60;
  var gb = document.getElementById('gb').value || 100;
  var confText = "[Interface]\nPrivateKey = aabbcc\nAddress = 10.0.0.2/32\nDNS = 1.1.1.1\n\n[Peer]\nPublicKey = ddeeff\nEndpoint = 123.45.67.89:51820\nAllowedIPs = 0.0.0.0/0";
  CONFIGS.unshift({name: name, days: days, gb: gb, confText: confText});
  draw();
  goTab(2);
  alert('کانفیگ با موفقیت ساخته شد!');
}
function draw(){
  var list = document.getElementById('list');
  if(!CONFIGS.length) return;
  var h = '';
  for(var i=0; i<CONFIGS.length; i++){
    var c = CONFIGS[i];
    h += '<div class="item"><b>🌐 ' + c.name + '</b> <span class="pill pill-ok">فعال</span>';
    h += '<div class="meta">' + c.days + ' روز · ' + c.gb + ' GB</div>';
    h += '<div class="dns">Endpoint: 123.45.67.89:51820</div>';
    h += '<div style="margin-top:8px"><button class="btn" style="background:#3b82f6;color:#fff;padding:6px 10px;font-size:12px;" onclick="navigator.clipboard.writeText(`' + c.confText + '`);alert(`کپی شد!`)">📋 کپی کانفیگ</button></div>';
    h += '</div>';
  }
  list.innerHTML = h;
}
</script>
</body>
  </html>
